<!DOCTYPE html>
<html lang="{{ config.default_language | default(value='en') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% if config.title != "" %}{{ config.title }}{% else %}厶月{% endif %}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{% if config.description != "" %}{{ config.description }}{% else %} {% endif %}{% endblock description %}">
  <link rel="icon" href="{{ get_url(path='favicon.svg') }}" type="image/svg+xml">
  <link rel="shortcut icon" href="{{ get_url(path='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ get_url(path='css/liquidweb.css') }}">
</head>
<body>
  <div class="liquid-bg" aria-hidden="true">
    <div class="liquid-overlay"></div>
    <div class="liquid-glow liquid-glow-a"></div>
    <div class="liquid-glow liquid-glow-b"></div>
    <div class="liquid-glow liquid-glow-c"></div>
  </div>

  <div class="site-layout{% block site_layout_class %}{% endblock site_layout_class %}">
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="{{ get_url(path='@/_index.md') }}">
          <span class="brand-logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M13 2.8V10h6.3L11 21.2V14H4.7L13 2.8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path>
            </svg>
          </span>
          <span class="brand-copy">
            <strong>{% if config.title != "" %}{{ config.title }}{% else %}厶月{% endif %}</strong>
            <small>{% if config.description != "" %}{{ config.description }}{% else %} {% endif %}</small>
          </span>
        </a>
        <nav class="site-nav">
          <a href="{{ get_url(path='@/_index.md') }}">首页</a>
          <a href="{{ get_url(path='@/categories.md') }}">分类</a>
          <a href="{{ get_url(path='about') }}">关于</a>
        </nav>
      </header>

      <main class="site-main">
        {% block content %}{% endblock content %}
      </main>

      <footer class="site-footer">
        <p>Built with Zola</p>
      </footer>
    </div>

    {% block page_sidebar %}{% endblock page_sidebar %}
  </div>

  <div class="floating-tools" id="floating-tools" aria-label="页面工具">
    <a class="floating-tool-btn" href="{{ get_url(path='@/_index.md') }}" title="返回首页" aria-label="返回首页">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 11.5L12 5l8 6.5"></path>
        <path d="M6.5 10.5V19h11v-8.5"></path>
      </svg>
    </a>
    <a class="floating-tool-btn" id="back-to-top" href="#top" title="返回顶部" aria-label="返回顶部">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 16l5-5 5 5"></path>
        <path d="M7 11l5-5 5 5"></path>
      </svg>
    </a>
    <button class="floating-tool-btn" id="toc-toggle" type="button" title="显示目录列表" aria-label="显示目录列表" aria-expanded="false" hidden>≡</button>
  </div>

  <svg class="liquid-filters" aria-hidden="true" focusable="false">
    <filter id="liquid-glass-panel" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.012" numOctaves="2" seed="19" result="noise"></feTurbulence>
      <feGaussianBlur in="noise" stdDeviation="0.75" result="blurred-noise"></feGaussianBlur>
      <feDisplacementMap in="SourceGraphic" in2="blurred-noise" scale="18" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
    </filter>
    <filter id="liquid-glass-orb" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.02" numOctaves="2" seed="29" result="noise"></feTurbulence>
      <feGaussianBlur in="noise" stdDeviation="0.85" result="blurred-noise"></feGaussianBlur>
      <feDisplacementMap in="SourceGraphic" in2="blurred-noise" scale="28" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
    </filter>
  </svg>

  <script>
    // Floating tools functionality
    const backTop = document.getElementById('back-to-top');
    const tocToggle = document.getElementById('toc-toggle');
    const mobileTocPanel = document.getElementById('mobile-toc-panel');
    const mobileTocBackdrop = document.getElementById('mobile-toc-backdrop');

    if (tocToggle && mobileTocPanel && mobileTocBackdrop) {
      tocToggle.hidden = false;

      const setMobileTocOpen = (open) => {
        mobileTocPanel.hidden = !open;
        mobileTocBackdrop.hidden = !open;
        tocToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        document.body.classList.toggle('mobile-toc-open', open);
      };

      tocToggle.addEventListener('click', () => {
        const isOpen = tocToggle.getAttribute('aria-expanded') === 'true';
        setMobileTocOpen(!isOpen);
      });

      mobileTocBackdrop.addEventListener('click', () => {
        setMobileTocOpen(false);
      });

      mobileTocPanel.addEventListener('click', (event) => {
        const target = event.target;
        if (target instanceof HTMLElement && target.closest('a')) {
          setMobileTocOpen(false);
        }
      });

      window.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          setMobileTocOpen(false);
        }
      });
    }

    window.addEventListener('scroll', () => {
      if (window.scrollY > 200) {
        backTop.classList.add('show');
      } else {
        backTop.classList.remove('show');
      }
    });
    backTop.addEventListener('click', (event) => {
      event.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
</body>
</html>
