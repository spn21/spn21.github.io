{% extends "base.html" %}

{% block content %}
{% set blog_section = get_section(path="blog/_index.md") %}
<div class="shell-app" id="shell-app">
  <section class="shell-screen" id="shell-screen" aria-live="polite"></section>
  
  <div class="shell-footer">
    <p class="shell-hint">commands: <code>help</code> <code>whoami</code> <code>ls</code> <code>cd blogs</code> <code>cat first.md</code> <code>clear</code></p>
    
    <form class="shell-entry" id="shell-entry" autocomplete="off">
      <label class="shell-prompt" for="shell-input">
        <span class="prompt">visitor@spn21</span><span class="prompt-sep">:</span><span class="cwd" id="shell-cwd">~</span><span class="prompt-mark">$</span>
      </label>
      <div class="input-wrapper">
        <input class="shell-input" id="shell-input" name="command" type="text" spellcheck="false" autofocus placeholder="type 'help'" />
        <ul class="autocomplete-list" id="autocomplete-list"></ul>
      </div>
    </form>
  </div>
</div>

<script>
  window.CLI_DATA = {
    identity: {
      name: "厶月",
      aliases: ["moumoon", "spn", "mouzi"]
    },
    about: {
      github: "https://github.com/spn21",
      email: "mouzi2118@gmail.com",
      interests: "Arknights, Skadi, Texas the Omertosa, Muelsyse, Ling",
      status: "the Ultimate Cybersociety Phobic"
    },
    categories: {
      {% set grouped = blog_section.pages | group_by(attribute="extra.tags.0") %}
      {% for category, pages in grouped %}
        {% set published = [] %}
        "{{ category | default(value="uncategorized") | lower }}": [
          {% for page in pages %}
            {% if page.extra.draft is defined and page.extra.draft == false %}
              "{{ page.slug }}.md",
            {% endif %}
          {% endfor %}
        ],
      {% endfor %}
    },
    posts: {
      {% for page in blog_section.pages %}
        {% if page.extra.draft is defined and page.extra.draft == false %}
          {% set category_name = page.extra.tags.0 | default(value="uncategorized") | lower %}
          "{{ page.slug }}.md": {
            slug: {{ page.slug | json_encode() | safe }},
            title: {{ page.title | default(value=page.slug) | json_encode() | safe }},
            date: {{ page.date | default(value="undated") | json_encode() | safe }},
            tags: {{ page.extra.tags | default(value=[]) | json_encode() | safe }},
            category: {{ category_name | json_encode() | safe }},
            permalink: {{ page.permalink | json_encode() | safe }},
            content: {{ page.content | safe | json_encode() | safe }}
          },
        {% endif %}
      {% endfor %}
    }
  };

  (() => {
    const data = window.CLI_DATA;
    const screen = document.getElementById('shell-screen');
    const input = document.getElementById('shell-input');
    const form = document.getElementById('shell-entry');
    const cwdLabel = document.getElementById('shell-cwd');
    const directories = {
      '~': ['home', 'blogs', 'categories'],
      '~/home': ['about.txt', 'profile.txt'],
      '~/blogs': Object.keys(data.posts),
      '~/categories': Object.keys(data.categories),
    };
    let cwd = '~';

    function escapeHtml(value) {
      return value
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function focusInput() {
      input.focus();
      cwdLabel.textContent = cwd;
    }

    function appendCommand(raw) {
      const line = document.createElement('div');
      line.className = 'shell-line';
      line.innerHTML = `<span class="prompt">visitor@spn21</span><span class="prompt-sep">:</span><span class="cwd">${escapeHtml(cwd)}</span><span class="prompt-mark">$</span><span class="shell-typed">${escapeHtml(raw)}</span>`;
      screen.appendChild(line);
    }

    function appendOutput(html, variant = '') {
      const block = document.createElement('div');
      block.className = `shell-output${variant ? ` ${variant}` : ''}`;
      block.innerHTML = html;
      screen.appendChild(block);
      screen.scrollTop = screen.scrollHeight;
    }

    function appendSystem(text) {
      appendOutput(`<p>${escapeHtml(text)}</p>`, 'shell-system');
    }

    function renderList(items) {
      appendOutput(`<div class="shell-list">${items.map((item) => `<span>${escapeHtml(item)}</span>`).join('')}</div>`);
    }

    function renderArticle(fileName) {
      const post = data.posts[fileName];
      if (!post) {
        appendSystem(`cat: ${fileName}: No such file`);
        return;
      }

      const tags = post.tags.length ? `<div class="shell-meta"><span>tags:</span><span>${post.tags.map(escapeHtml).join(', ')}</span></div>` : '';
      appendOutput(`
        <article class="shell-article">
          <div class="shell-meta"><span>file:</span><span>${escapeHtml(fileName)}</span></div>
          <div class="shell-meta"><span>title:</span><span>${escapeHtml(post.title)}</span></div>
          <div class="shell-meta"><span>date:</span><span>${escapeHtml(post.date)}</span></div>
          <div class="shell-meta"><span>category:</span><span>${escapeHtml(post.category)}</span></div>
          ${tags}
          <div class="article-content shell-article-body">${post.content}</div>
        </article>
      `, 'shell-article-wrap');
    }

    function renderAbout() {
      appendOutput(`
        <div class="shell-file">
          <div class="shell-meta"><span>name:</span><span>${escapeHtml(data.identity.name)}</span></div>
          <div class="shell-meta"><span>alias:</span><span>${data.identity.aliases.map(escapeHtml).join(' ')}</span></div>
          <div class="shell-meta"><span>github:</span><a href="${escapeHtml(data.about.github)}">${escapeHtml(data.about.github)}</a></div>
          <div class="shell-meta"><span>email:</span><a href="mailto:${escapeHtml(data.about.email)}">${escapeHtml(data.about.email)}</a></div>
          <div class="shell-meta"><span>interests:</span><span>${escapeHtml(data.about.interests)}</span></div>
          <div class="shell-meta"><span>status:</span><span>${escapeHtml(data.about.status)}</span></div>
        </div>
      `, 'shell-file-wrap');
    }

    function resolvePath(target) {
      if (!target || target === '~' || target === '/') return '~';
      if (target === '..') {
        if (cwd === '~') return '~';
        const parts = cwd.split('/');
        parts.pop();
        return parts.length === 1 ? '~' : parts.join('/');
      }
      if (target.startsWith('~/')) return target;
      if (target.startsWith('/')) return `~${target}`;
      return cwd === '~' ? `~/${target}` : `${cwd}/${target}`;
    }

    function commandHelp() {
      appendOutput(`
        <div class="shell-help">
          <div><span>whoami</span><span>show identity</span></div>
          <div><span>pwd</span><span>print current path</span></div>
          <div><span>ls</span><span>list entries in current path</span></div>
          <div><span>cd &lt;dir&gt;</span><span>change path: home, blogs, categories, .., ~</span></div>
          <div><span>cat about.txt</span><span>show profile</span></div>
          <div><span>cat help.txt</span><span>show command help</span></div>
          <div><span>cat &lt;slug&gt;.md</span><span>open article from ~/blogs</span></div>
          <div><span>clear</span><span>clear terminal screen</span></div>
        </div>
      `, 'shell-help-wrap');
    }

    function runCommand(raw) {
      const command = raw.trim();
      appendCommand(raw);

      if (!command) {
        appendOutput('', 'shell-empty');
        return;
      }

      if (command === 'clear') {
        screen.innerHTML = '';
        return;
      }

      if (command === 'help' || command === 'cat help.txt') {
        commandHelp();
        return;
      }

      if (command === 'whoami') {
        appendSystem(`${data.identity.name} ${data.identity.aliases[0]}`);
        return;
      }

      if (command === 'pwd') {
        appendSystem(cwd);
        return;
      }

      if (command === 'ls') {
        const items = directories[cwd] || [];
        renderList(items);
        return;
      }

      if (command.startsWith('cd ')) {
        const target = command.slice(3).trim();
        const next = resolvePath(target);
        if (directories[next]) {
          cwd = next;
          focusInput();
        } else {
          appendSystem(`cd: ${target}: No such directory`);
        }
        return;
      }

      if (command.startsWith('cat ')) {
        const target = command.slice(4).trim();
        if (target === 'about.txt' || target === 'profile.txt') {
          renderAbout();
          return;
        }
        renderArticle(target);
        return;
      }

      appendSystem(`${command}: command not found`);
    }

    function runHashCommand() {
      const hash = window.location.hash.startsWith('#cmd=')
        ? decodeURIComponent(window.location.hash.slice(5))
        : '';

      if (!hash) return;

      hash
        .split(';')
        .map((part) => part.trim())
        .filter(Boolean)
        .forEach((part) => runCommand(part));
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const value = input.value;
      input.value = '';
      autocompleteList.innerHTML = '';
      autocompleteList.classList.remove('active');
      runCommand(value);
      focusInput();
    });

    // Autocomplete functionality
    const autocompleteList = document.getElementById('autocomplete-list');
    let selectedIndex = -1;

    function getAllCompletions() {
      const allCommands = ['help', 'whoami', 'pwd', 'ls', 'cd', 'cat', 'clear'];
      const allDirs = ['~', 'home', 'blogs', 'categories', '..'];
      const allArticles = Object.keys(data.posts);
      return {
        commands: allCommands,
        directories: allDirs,
        articles: allArticles
      };
    }

    function getCompletions(input) {
      const completions = getAllCompletions();
      const parts = input.trim().split(/\s+/);
      const currentPart = parts[parts.length - 1];
      
      if (parts.length === 1 || input.endsWith(' ')) {
        // Suggest commands
        return completions.commands
          .filter(cmd => cmd.startsWith(currentPart))
          .slice(0, 10);
      } else if (parts[0] === 'cd' && parts.length === 2) {
        // Suggest directories after 'cd'
        return completions.directories
          .filter(dir => dir.startsWith(currentPart))
          .slice(0, 10);
      } else if (parts[0] === 'cat' && parts.length === 2) {
        // Suggest articles after 'cat'
        const suggestions = [
          'about.txt',
          'profile.txt',
          ...completions.articles
        ];
        return suggestions
          .filter(file => file.startsWith(currentPart))
          .slice(0, 10);
      }
      
      return [];
    }

    function updateAutocomplete() {
      const inputValue = input.value;
      const completions = getCompletions(inputValue);
      selectedIndex = -1;

      if (completions.length === 0) {
        autocompleteList.innerHTML = '';
        autocompleteList.classList.remove('active');
        return;
      }

      autocompleteList.innerHTML = completions
        .map((item, index) => `<li data-index="${index}">${escapeHtml(item)}</li>`)
        .join('');
      autocompleteList.classList.add('active');
    }

    function selectCompletion(index) {
      const items = autocompleteList.querySelectorAll('li');
      if (index < 0 || index >= items.length) return;
      
      items.forEach(item => item.classList.remove('selected'));
      items[index].classList.add('selected');
      selectedIndex = index;
    }

    input.addEventListener('input', updateAutocomplete);

    input.addEventListener('keydown', (event) => {
      if (!autocompleteList.classList.contains('active')) {
        if (event.key === 'Tab') {
          event.preventDefault();
          updateAutocomplete();
          if (getCompletions(input.value).length > 0) {
            selectCompletion(0);
          }
        }
        return;
      }

      if (event.key === 'ArrowDown') {
        event.preventDefault();
        selectCompletion(selectedIndex + 1);
      } else if (event.key === 'ArrowUp') {
        event.preventDefault();
        selectCompletion(selectedIndex - 1);
      } else if (event.key === 'Enter') {
        if (selectedIndex >= 0) {
          event.preventDefault();
          const items = autocompleteList.querySelectorAll('li');
          const selected = items[selectedIndex].textContent;
          const parts = input.value.trim().split(/\s+/);
          
          if (parts.length === 1 || input.value.endsWith(' ')) {
            input.value = selected + ' ';
          } else {
            parts[parts.length - 1] = selected;
            input.value = parts.join(' ');
          }
          
          updateAutocomplete();
          input.focus();
        }
      } else if (event.key === 'Escape') {
        autocompleteList.innerHTML = '';
        autocompleteList.classList.remove('active');
      } else if (event.key === 'Tab') {
        event.preventDefault();
        selectCompletion(selectedIndex + 1);
      }
    });

    autocompleteList.addEventListener('click', (event) => {
      if (event.target.tagName === 'LI') {
        const selected = event.target.textContent;
        const parts = input.value.trim().split(/\s+/);
        
        if (parts.length === 1 || input.value.endsWith(' ')) {
          input.value = selected + ' ';
        } else {
          parts[parts.length - 1] = selected;
          input.value = parts.join(' ');
        }
        
        autocompleteList.innerHTML = '';
        autocompleteList.classList.remove('active');
        input.focus();
      }
    });

    document.getElementById('shell-app').addEventListener('click', focusInput);

    runHashCommand();
    focusInput();
  })();
</script>
{% endblock content %}
