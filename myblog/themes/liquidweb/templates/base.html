<!DOCTYPE html>
<html lang="{{ config.default_language | default(value='en') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% if config.title != "" %}{{ config.title }}{% else %}LiquidWeb{% endif %}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{% if config.description != "" %}{{ config.description }}{% else %}现代 Web 设计工作室{% endif %}{% endblock description %}">
  <link rel="stylesheet" href="{{ get_url(path='css/liquidweb.css') }}">
</head>
<body>
  <div class="liquid-bg" aria-hidden="true">
    <div class="liquid-overlay"></div>
    <div class="liquid-glow liquid-glow-a"></div>
    <div class="liquid-glow liquid-glow-b"></div>
  </div>

  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="{{ get_url(path='@/_index.md') }}">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M13 2.8V10h6.3L11 21.2V14H4.7L13 2.8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path>
          </svg>
        </span>
        <span class="brand-copy">
          <strong>{% if config.title != "" %}{{ config.title }}{% else %}LiquidWeb{% endif %}</strong>
          <small>{% if config.description != "" %}{{ config.description }}{% else %}现代 Web 设计工作室{% endif %}</small>
        </span>
      </a>
      <nav class="site-nav">
        <a href="{{ get_url(path='@/_index.md') }}">首页</a>
        <a href="{{ get_url(path='@/blog/_index.md') }}">文章</a>
      </nav>
    </header>

    <main class="site-main">
      {% block content %}{% endblock content %}
    </main>

    <footer class="site-footer">
      <p>Built with Zola</p>
    </footer>
  </div>
</body>
</html>
