<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">First Post Cover</title>
  <desc id="desc">Gradient cover image for first post</desc>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#g1)"/>
  <text x="80" y="360" fill="#ffffff" font-size="74" font-family="Avenir Next, Segoe UI, sans-serif" font-weight="700">My First Post</text>
</svg>
