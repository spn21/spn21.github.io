  <link rel="stylesheet" href="https://spn21.github.io/css/liquidweb.css">
</head>
<body>
  <div class="liquid-bg" aria-hidden="true">
    <div class="liquid-overlay"></div>
    <div class="liquid-glow liquid-glow-a"></div>
    <div class="liquid-glow liquid-glow-b"></div>
    <div class="liquid-glow liquid-glow-c"></div>
  </div>

  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="https://spn21.github.io/">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M13 2.8V10h6.3L11 21.2V14H4.7L13 2.8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path>
          </svg>
        </span>
        <span class="brand-copy">
          <strong>厶月</strong>
          <small> </small>
        </span>
      </a>
      <nav class="site-nav">
        <a href="https://spn21.github.io/">首页</a>
        <a href="https://spn21.github.io/blog/categories/">分类</a>
        <a href="https://spn21.github.io/about">关于</a>
        <button class="theme-switcher" id="theme-switcher" type="button" title="切换主题">🌙</button>
      </nav>
    </header>

    <main class="site-main">
      

  <article class="article-shell">
    <a class="back-link" href="https://spn21.github.io/blog/categories/">返回分类列表</a>
    <header class="article-header">
      <h1>文章未公开</h1>
      <p class="article-meta">该文章仍为草稿，将 <code>draft</code> 改为 <code>false</code> 后可见。</p>
    </header>
  </article>


    </main>

    <a id="back-to-top" href="#" title="返回顶部" aria-label="返回顶部">↑</a>

    <footer class="site-footer">
      <p>Built with Zola</p>
    </footer>
  </div>

  <svg class="liquid-filters" aria-hidden="true" focusable="false">
    <filter id="liquid-glass-panel" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.012" numOctaves="2" seed="19" result="noise"></feTurbulence>
      <feGaussianBlur in="noise" stdDeviation="0.75" result="blurred-noise"></feGaussianBlur>
      <feDisplacementMap in="SourceGraphic" in2="blurred-noise" scale="18" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
    </filter>
    <filter id="liquid-glass-orb" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.02" numOctaves="2" seed="29" result="noise"></feTurbulence>
      <feGaussianBlur in="noise" stdDeviation="0.85" result="blurred-noise"></feGaussianBlur>
      <feDisplacementMap in="SourceGraphic" in2="blurred-noise" scale="28" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
    </filter>
  </svg>

  <script>
    // Theme switcher functionality
    const themeSwitcher = document.getElementById('theme-switcher');
    
    // Initialize theme switcher button
    function updateThemeSwitcherUI() {
      const theme = localStorage.getItem('selectedTheme') || 'liquidweb';
      if (theme === 'cli') {
        themeSwitcher.textContent = '💻';
        themeSwitcher.title = '切换到 Liquid 主题';
      } else {
        themeSwitcher.textContent = '🌙';
        themeSwitcher.title = '切换到 CLI 主题';
      }
    }
    
    updateThemeSwitcherUI();
    
    themeSwitcher.addEventListener('click', () => {
      const theme = localStorage.getItem('selectedTheme') || 'liquidweb';
      const newTheme = theme === 'liquidweb' ? 'cli' : 'liquidweb';
      localStorage.setItem('selectedTheme', newTheme);
      
      // Reload to apply theme
      window.location.reload();
    });

    // Back to top functionality
    const backTop = document.getElementById('back-to-top');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 200) {
        backTop.classList.add('show');
      } else {
        backTop.classList.remove('show');
      }
    });
    backTop.addEventListener('click', (event) => {
      event.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
</body>
</html>
